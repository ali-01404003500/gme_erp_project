[supervisord]
nodaemon=true

[program:app]
command=php artisan serve --host=0.0.0.0 --port=8000
autostart=true
autorestart=true
priority=1

[program:queue]
command=php artisan queue:work --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
priority=2

[program:scheduler]
command=php artisan schedule:work
autostart=true
autorestart=true
priority=3
