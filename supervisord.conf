[supervisord]
nodaemon=true

[program:app]
command=php artisan octane:frankenphp --host=0.0.0.0 --port=8000 --workers=2 --max-requests=500
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/app-out.log
stderr_logfile=/var/log/supervisor/app-error.log

[program:queue]
command=php artisan queue:work --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
priority=2
stdout_logfile=/var/log/supervisor/queue-out.log
stderr_logfile=/var/log/supervisor/queue-error.log

[program:scheduler]
command=php artisan schedule:work
autostart=true
autorestart=true
priority=3
stdout_logfile=/var/log/supervisor/scheduler-out.log
stderr_logfile=/var/log/supervisor/scheduler-error.log
